# Dose curve at one alpha, adapter-space arms only. Dose-100 runs are shared with alpha_sweep.yaml.
# queue.py sets every arm to the alpha the sweep picked for A3, so the nulls stay matched to A3.
# Placeholders below are 0.1.
attack:
  doses: [10, 50, 100]
  seeds: [0, 1, 2]

repair:
  arms: [A0, A3, A4a, A5a, A6, A7]
  alpha_per_arm: {A3: 0.1, A4a: 0.1, A5a: 0.1, A6: 0.1, A7: 0.1}
  mask_seeds: [0, 1]
