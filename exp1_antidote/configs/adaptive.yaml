# Mask-aware attacker vs the adapter-space arms at dose 100. Needs its own output root
# (queue.py uses <root>_adaptive); add your usual --profile flags:
#   python -m exp1_antidote.run_grid --config exp1_antidote/configs/adaptive.yaml --stage all
# The relearning re-attack lives in relearn.yaml.
attack:
  doses: [100]
  seeds: [0, 1, 2]

repair:
  arms: [A0, A3, A4a, A5a, A6]
  alphas: [0.1]            # queue.py sets this (and adaptive.alpha) to the sweep's A3 alpha
  mask_seeds: [0, 1]

adaptive:
  mask_aware: true
  alpha: 0.1               # keep equal to repair.alphas

hub:
  adapters_repo: exp1-antidote-adaptive-adapters
  logs_repo: exp1-antidote-adaptive-logs
